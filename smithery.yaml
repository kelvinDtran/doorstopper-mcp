## Smithery configuration — https://smithery.ai/docs/build/project-config
##
## stdio-only deployment: Smithery runs `node dist/index.js` and proxies
## the local stdio server to its hosted endpoint. No env vars required —
## all tools are public and anonymous.

startCommand:
  type: stdio
  command: "node"
  args:
    - "dist/index.js"
  configSchema:
    type: object
    properties: {}
    required: []
build:
  dockerfile: Dockerfile
